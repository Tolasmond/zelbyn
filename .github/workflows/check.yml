# The checks a change must pass (tools/check.py), with the Odin release
# they are pinned to (actions/install-odin), on Linux and on Windows, whose
# 1 MB main-thread stack the stack limits are sized for. The corpus checks
# need clones of kaitai_struct_formats and kaitai_struct_samples, and
# Node.js, and are run by hand (doc/development.md).
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install-odin

      - name: Checks
        run: python3 tools/check.py

  check-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install-odin

      - name: Checks
        run: python tools/check.py
