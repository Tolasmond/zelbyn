# The checks a change must pass (tools/check.py), with the Odin release
# they are pinned to, on Linux and on Windows, whose 1 MB main-thread stack
# the stack limits are sized for. The corpus checks need clones of
# kaitai_struct_formats and kaitai_struct_samples, and Node.js, and are run
# by hand (doc/development.md).
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin dev-2026-10 (commit 84bc3fc)
        run: |
          curl -fsSL -o odin.tar.gz https://github.com/odin-lang/Odin/releases/download/dev-2026-10/odin-linux-amd64-dev-2026-10.tar.gz
          echo "c3c8b095621fd0c75f7f73e3a0829f1b4d45324225f20ba11ed8dc4da310a8ab  odin.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/odin"
          tar -xzf odin.tar.gz -C "$RUNNER_TEMP/odin" --strip-components=1
          rm odin.tar.gz
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"

      - name: Checks
        run: python3 tools/check.py

  check-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin dev-2026-10 (commit 84bc3fc)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/odin-lang/Odin/releases/download/dev-2026-10/odin-windows-amd64-dev-2026-10.zip -OutFile odin.zip
          $hash = (Get-FileHash odin.zip -Algorithm SHA256).Hash
          if ($hash -ne 'B6B2E426A8B6F147B74EC7E18BEF8DF27CF40FE16193159DF7CA09A0CC0C2011') { throw "odin.zip: SHA-256 $hash" }
          Expand-Archive odin.zip -DestinationPath "$env:RUNNER_TEMP\odin"
          Remove-Item odin.zip
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\odin\dist"

      - name: Checks
        run: python tools/check.py
